<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes · Swaxilep</title>
    <meta name="description" content="Swaxilep (Teoman) — 3D artist and game developer, sculpture student at Anadolu University. Posts, notes and contact.">
    <meta name="theme-color" content="#ffffff">

    <meta property="og:title" content="Notes · Swaxilep">
    <meta property="og:description" content="Leave Swaxilep a note.">
    <meta property="og:image" content="https://swaxilep.com/shared/Profile.png">
    <meta property="og:url" content="https://swaxilep.com/notes">

    <link rel="icon" type="image/png" href="shared/Icon.png">
    <link rel="apple-touch-icon" href="shared/Icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css?v=44">
</head>

<body data-page="notes" data-title-key="meta.notes">

    <main class="page">
        <div class="wrap">
            <header class="page-head">
                <h1 data-i18n="notes.title"></h1>
                <p data-i18n="notes.lede"></p>
            </header>

            <div class="panel">
                <form id="noteForm" novalidate>
                    <label class="field">
                        <span class="field-label" data-i18n="notes.name"></span>
                        <input class="input" type="text" name="name" id="noteName" maxlength="40" autocomplete="nickname" required
                            data-i18n-placeholder="notes.name.ph">
                    </label>
                    <label class="field">
                        <span class="field-label">
                            <span data-i18n="notes.message"></span>
                            <span id="noteCount">0 / 1000</span>
                        </span>
                        <textarea class="input" name="message" id="noteMessage" maxlength="1000" rows="4" required
                            data-i18n-placeholder="notes.message.ph"></textarea>
                    </label>
                    <!-- honeypot: real visitors never see or fill this -->
                    <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

                    <p class="form-error" id="noteError" role="alert" hidden></p>

                    <div class="form-foot">
                        <span class="hint" data-i18n="notes.once"></span>
                        <button type="submit" class="btn btn-primary" id="noteSend" data-i18n="notes.send"></button>
                    </div>
                </form>

                <div class="sent" id="noteSent" hidden>
                    <h2 data-i18n="notes.sent.title"></h2>
                    <p data-i18n="notes.sent.text"></p>
                </div>
            </div>

            <div class="notes-head">
                <h2 id="noteTotal" data-i18n="notes.title"></h2>
            </div>
            <p class="status" id="noteStatus" data-i18n="notes.loading"></p>
            <ul class="note-list" id="noteList"></ul>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="config.js?v=44"></script>
    <script src="assets/site.js?v=44"></script>
    <script src="assets/notes.js?v=44"></script>
</body>

</html>
