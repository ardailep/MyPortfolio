<body data-title-key="hub.meta.title">

    <!-- Background -->
    <div class="bg" aria-hidden="true">
        <div class="bg-image"></div>
        <video class="bg-video" muted loop playsinline preload="none" data-src="shared/background.mp4?v=31">

        <div class="bg-grain"></div>
    </div>

    <main class="hub">

            <div class="lang-switch" role="group" aria-label="Language">
                <button type="button" data-lang="en" aria-pressed="true">EN</button>
                <button type="button" data-lang="tr" aria-pressed="false">TR</button>

            <p class="eyebrow hub-meta">
                <span data-i18n="hero.eyebrow">Portfolio · 2026</span>
                <span class="visitor-count" id="visitorCount" hidden></span>
            </p>
        </header>

        <nav class="hub-links" aria-label="Pages">
            <a href="/about" class="hub-link">
                <span class="hub-link-title" data-i18n="hub.about">About / Links</span>
            </a>
            <a href="/letters" class="hub-link">
                <span class="hub-link-title" data-i18n="hub.note">Leave a note</span>
            </a>
            <a href="/roblox" class="hub-link">
                <span class="hub-link-title">Roblox</span>
            </a>
        </nav>

        <p class="hub-foot" data-i18n="footer.copy">© 2026 Swaxilep. All rights reserved.</p>
