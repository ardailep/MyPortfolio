<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Swaxilep</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">

    <link rel="icon" type="image/png" href="shared/Icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css?v=44">
</head>

<body data-page="admin" data-title-key="meta.admin">

    <main class="page">
        <div class="wrap">

            <p class="status" id="adminStatus" hidden></p>

            <!-- Login -->
            <section class="panel" id="loginCard" hidden>
                <h1 class="panel-title" data-i18n="admin.login.title"></h1>
                <form id="loginForm">
                    <label class="field">
                        <span class="field-label" data-i18n="admin.email"></span>
                        <input class="input" type="email" id="loginEmail" required autocomplete="username">
                    </label>
                    <label class="field">
                        <span class="field-label" data-i18n="admin.password"></span>
                        <input class="input" type="password" id="loginPassword" required autocomplete="current-password">
                    </label>
                    <p class="form-error" id="loginError" role="alert" hidden></p>
                    <div class="form-foot">
                        <span></span>
                        <button type="submit" class="btn btn-primary" id="loginSubmit" data-i18n="admin.login"></button>
                    </div>
                </form>
            </section>

            <!-- Panel -->
            <div id="panel" hidden>
                <header class="page-head admin-head">
                    <h1 data-i18n="admin.title"></h1>
                    <button type="button" class="btn btn-sm" id="logout" data-i18n="admin.logout"></button>
                </header>

                <div class="tabs" role="tablist">
                    <button type="button" role="tab" id="tabPosts" aria-selected="true" aria-controls="postsPane" data-i18n="admin.tab.posts"></button>
                    <button type="button" role="tab" id="tabNotes" aria-selected="false" aria-controls="notesPane" data-i18n="admin.tab.notes"></button>
                </div>

                <!-- Posts -->
                <div id="postsPane" role="tabpanel" aria-labelledby="tabPosts" class="admin-stack">
                    <form id="postForm" class="panel" novalidate>
                        <h2 class="panel-title" id="formTitle" data-i18n="admin.new"></h2>
                        <label class="field">
                            <span class="field-label" data-i18n="admin.f.title"></span>
                            <input class="input" type="text" id="postTitle" maxlength="200">
                        </label>
                        <label class="field">
                            <span class="field-label">
                                <span data-i18n="admin.f.body"></span>
                                <span id="bodyCount">0 / 20000</span>
                            </span>
                            <textarea class="input" id="postBody" maxlength="20000" rows="8"></textarea>
                            <span class="hint" data-i18n="admin.f.body.hint"></span>
                        </label>
                        <label class="field">
                            <span class="field-label" data-i18n="admin.f.tweet"></span>
                            <input class="input" type="url" id="postTweet" inputmode="url" autocomplete="off" data-i18n-placeholder="admin.f.tweet.ph">
                            <span class="hint" data-i18n="admin.f.tweet.hint"></span>
                        </label>
                        <div class="field">
                            <span class="field-label" data-i18n="admin.f.image"></span>
                            <div class="image-row">
                                <label class="btn btn-sm file-btn">
                                    <span data-i18n="admin.f.upload"></span>
                                    <input type="file" id="postFile" accept="image/*">
                                </label>
                                <input class="input" type="url" id="postImage" inputmode="url" autocomplete="off" data-i18n-placeholder="admin.f.image.ph">
                                <button type="button" class="btn btn-sm" id="imageRemove" data-i18n="admin.f.remove" hidden></button>
                            </div>
                            <img class="image-preview" id="imagePreview" alt="" referrerpolicy="no-referrer" hidden>
                        </div>
                        <label class="field">
                            <span class="field-label" data-i18n="admin.f.date"></span>
                            <input class="input input-date" type="date" id="postDate" required>
                        </label>
                        <label class="check">
                            <input type="checkbox" id="postPinned">
                            <span data-i18n="admin.f.pinned"></span>
                        </label>
                        <label class="check">
                            <input type="checkbox" id="postPublished" checked>
                            <span data-i18n="admin.f.published"></span>
                        </label>

                        <p class="form-error" id="postError" role="alert" hidden></p>

                        <div class="form-foot">
                            <span class="form-ok" id="postOk" role="status"></span>
                            <div class="admin-actions">
                                <button type="button" class="btn" id="postCancel" data-i18n="admin.cancel" hidden></button>
                                <button type="submit" class="btn btn-primary" id="postSave" data-i18n="admin.save"></button>
                            </div>
                        </div>
                    </form>

                    <div>
                        <h2 class="panel-title" data-i18n="admin.posts.list"></h2>
                        <p class="status" id="postsStatus" hidden></p>
                        <ul class="admin-list" id="postList"></ul>
                    </div>
                </div>

                <!-- Notes -->
                <div id="notesPane" role="tabpanel" aria-labelledby="tabNotes" hidden>
                    <p class="status" id="notesStatus" hidden></p>
                    <ul class="admin-list" id="noteList"></ul>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="config.js?v=44"></script>
    <script src="assets/site.js?v=44"></script>
    <script src="assets/admin.js?v=44"></script>
</body>

</html>
