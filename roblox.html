<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swaxilep · Roblox</title>
    <meta name="description" content="Swaxilep's Roblox profile — avatar, stats, the games I've developed and the groups I develop games for.">
    <meta name="theme-color" content="#0d0a09">

    <link rel="icon" type="image/png" href="shared/Icon.png">
    <link rel="apple-touch-icon" href="shared/Icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=33">
    <link rel="stylesheet" href="roblox.css?v=7">
</head>

<body data-title-key="roblox.meta.title">

    <!-- Background (same as the main site) -->
    <div class="bg" aria-hidden="true">
        <div class="bg-image"></div>
        <video class="bg-video" muted loop playsinline preload="none" data-src="shared/background.mp4?v=33">
        </video>
        <div class="bg-tint"></div>
        <div class="bg-grain"></div>
    </div>

    <header class="page-top">
        <a href="/" class="page-home">← swaxilep.com</a>
        <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-lang="en" aria-pressed="true">EN</button>
            <button type="button" data-lang="tr" aria-pressed="false">TR</button>
        </div>
    </header>

    <main class="rb-wrap">
        <!-- Profile -->
        <section class="profile" aria-busy="true" id="profile">
            <div class="avatar">
                <img id="avatarImg" alt="" hidden>
                <div class="avatar-placeholder" id="avatarPlaceholder"></div>
            </div>

            <div class="profile-info">
                <p class="eyebrow" data-t="profileLabel">Roblox profile</p>
                <h1 class="display-name" id="displayName">&nbsp;</h1>
                <p class="username" id="username">&nbsp;</p>
                <p class="bio" id="bio"></p>

                <dl class="stats">
                    <div><dt data-t="friends">Friends</dt><dd id="statFriends">–</dd></div>
                    <div><dt data-t="followers">Followers</dt><dd id="statFollowers">–</dd></div>
                    <div><dt data-t="following">Following</dt><dd id="statFollowing">–</dd></div>
                    <div><dt data-t="joined">Joined</dt><dd id="statJoined">–</dd></div>
                </dl>

                <a class="btn btn-ghost btn-sm profile-link" href="https://www.roblox.com/users/940248004/profile" target="_blank" rel="noopener" data-t="viewProfile">View on Roblox</a>
            </div>
        </section>

        <!-- Games I've developed -->
        <section class="rb-section">
            <div class="rb-section-top">
                <h2 data-t="favorites">Games I’ve developed</h2>
                <p class="updated"><span class="live-dot" aria-hidden="true"></span><span id="updated"></span></p>
            </div>
            <p class="status" id="gamesStatus">Loading…</p>
            <ul class="rows" id="gameGrid"></ul>
        </section>

        <!-- Groups I develop games for -->
        <section class="rb-section">
            <div class="rb-section-top">
                <h2 data-t="groups">Groups I develop games for</h2>
            </div>
            <p class="status" id="groupsStatus">Loading…</p>
            <ul class="rows rows--groups" id="groupGrid"></ul>
        </section>
    </main>

    <footer class="rb-foot">
        <p data-t="source">Data comes live from Roblox via RoProxy. Not affiliated with Roblox.</p>
    </footer>

    <script src="letters-config.js?v=33"></script>
    <script src="common.js?v=33"></script>
    <script src="roblox.js?v=10"></script>
</body>

</html>
